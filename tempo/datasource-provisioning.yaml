# Grafana datasource provisioning for Tempo (reference copy).
#
# The running declaration lives in infra-grafana's provisioning tree; this
# file documents the contract this stack exposes:
#
#   uid:   tempo          ← dashboards reference traces via this uid
#   url:   http://localhost:3200   ← Grafana runs on the host network too
#
# To consume it from the sibling repo, drop it into
# ../grafana/provisioning/datasources/ with the same content.

apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
